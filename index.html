<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />

    <title>M8 | Cookies check</title>
  </head>
  <body class="min-h-screen flex items-end md:justify-end justify-center p-2">
    <div
      id="cookiesContainer"
      class="w-72 min-h-56 bg-black text-white p-6 rounded-xl grid grid-cols-2 gap-4 shadow-md shadow-black"
    >
      <p><i class="fa-solid fa-cookie-bite text-4xl"></i></p>
      <button class="size-6 justify-self-end text-gray-500" id="close">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <p class="col-span-2">We use cookies to improve your user experience.</p>
      <button
        id="ok"
        class="col-span-2 bg-white text-black rounded-xl font-bold py-3 hover:bg-gray-300 transition-colors"
      >
        I like cookies
      </button>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
